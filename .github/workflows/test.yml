name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: run-kagami
        continue-on-error: true
        with:
          output-format: json
          log-level: info
          fail-on-severity: unknown
          config-file: test/kagami.yml
      # The report is read from the files, as embedding it in the scripts with `${{ }}` breaks the
      # shell syntax, and it is too large to be passed as an environment variable.
      - name: Print stdout
        env:
          STDOUT_FILE: ${{ steps.run-kagami.outputs.stdout-file }}
        run: |
          echo "stdout:"
          cat "$STDOUT_FILE"
      - name: Print stderr
        env:
          STDERR_FILE: ${{ steps.run-kagami.outputs.stderr-file }}
        run: |
          echo "stderr:"
          cat "$STDERR_FILE"
      - name: Assert that the stdout and stderr outputs are set
        env:
          HAS_STDOUT: ${{ steps.run-kagami.outputs.stdout != '' }}
          HAS_STDERR: ${{ steps.run-kagami.outputs.stderr != '' }}
        run: |
          if [ "$HAS_STDOUT" != "true" ] || [ "$HAS_STDERR" != "true" ]; then
            echo "Expected the stdout and stderr outputs to be non-empty, but they were not."
            exit 1
          fi
      - name: Assert that the stdout is valid JSON
        env:
          STDOUT_FILE: ${{ steps.run-kagami.outputs.stdout-file }}
        run: |
          jq empty "$STDOUT_FILE"
      - name: Assert that the stderr is not empty
        env:
          STDERR_FILE: ${{ steps.run-kagami.outputs.stderr-file }}
        run: |
          if [ ! -s "$STDERR_FILE" ]; then
            echo "Expected stderr to be non-empty, but it was empty."
            exit 1
          fi
      # The report is an array of the targets, each of which holds the advisories found for it.
      - name: Assert that the output contains the expected vulnerabilities
        env:
          STDOUT_FILE: ${{ steps.run-kagami.outputs.stdout-file }}
        run: |
          jq -e '[.[].advisories[]] | length > 0' "$STDOUT_FILE"
      - name: Assert that the exit code is 1
        run: |
          if [ "${{ steps.run-kagami.outcome }}" != "failure" ]; then
            echo "Expected the action to fail, but it succeeded."
            exit 1
          fi
